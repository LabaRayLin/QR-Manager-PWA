<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f46"><title>QR 管理室</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>YOUR LINKS · YOUR CONTROL</small><h1>QR 管理室</h1><p>先印出，再決定去向。</p></div><button id="install" hidden>安裝 App</button></header>
<main><section class="panel"><h2>連線設定</h2><form id="connectionForm" method="post" autocomplete="on"><div class="grid"><label>GitHub 帳號<input id="owner" list="ownerOptions" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="your-account"></label><label>儲存庫名稱<input id="repo" list="repoOptions" placeholder="qr-links"></label><label>分支<input id="branch" list="branchOptions" value="main"></label><label>GitHub Pages 網址<input id="base" list="baseOptions" type="url" placeholder="https://your-account.github.io/qr-links/"></label></div><label>專用權杖（可由 Chrome 密碼管理員儲存與自動填入）<input id="token" name="password" type="password" autocomplete="current-password" placeholder="github_pat_…"></label><div class="actions"><button id="connect" type="submit">連線並讀取清單</button><button id="lock" type="button" class="secondary">清除權杖</button><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">建立權杖 ↗</a><a href="README.md" target="_blank">設定說明 ↗</a></div><datalist id="ownerOptions"></datalist><datalist id="repoOptions"></datalist><datalist id="branchOptions"></datalist><datalist id="baseOptions"></datalist></form><p class="hint">權杖不會存入本網站的本機資料或備份；如選擇儲存，由瀏覽器密碼管理員保管。清除權杖只清空目前欄位，不會刪除瀏覽器已儲存的密碼。</p><p class="hint">選擇專用儲存庫，Contents 設為 Read and write。免費 Pages 的網址清單會公開。</p></section>
<section class="panel"><div class="section-head"><h2>我的 QR Code <span id="count"></span></h2><span id="dirty">本機草稿</span></div><div class="actions"><button id="add">新增一組</button><input id="batchCount" type="number" min="1" max="200" value="50" aria-label="批次數量"><button id="batch" class="secondary">批次建立</button><button id="publish">發布全部變更</button></div><div class="actions"><input id="search" placeholder="搜尋編號、名稱或網址"><button id="backup" class="secondary">備份 JSON</button><label class="file-button">匯入備份<input id="import" type="file" accept=".json,application/json" hidden></label><button id="sheet" class="secondary">列印全部 QR</button></div><p id="status" role="status" aria-live="polite">尚未連線。可以先建立本機草稿。</p><div id="list"></div></section></main>
<dialog id="qrDialog"><h2 id="qrTitle"></h2><div id="qrPreview"></div><p id="qrLink"></p><div class="actions"><button id="download">下載 SVG</button><button id="closeDialog" class="secondary">關閉</button></div></dialog>
<script src="vendor/qrcodegen.js"></script><script src="deployment.js" defer></script><script src="app.js" defer></script><script src="letter.js" defer></script><script src="connection-options.js" defer></script></body></html>
